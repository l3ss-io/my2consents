name: Publish to R2

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-my2consents
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Validate release tag
        run: node scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: npm ci
      - name: Verify and build
        run: npm run verify
      - name: Publish and verify release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
        run: node scripts/publish-release.mjs "$GITHUB_REF_NAME"
